version: '3.8'

services:
  ai-engine:
    build: .
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - AI_SERVICE_API_KEY=reliefchain_dev_secret_key_2026
      - HOST=0.0.0.0
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3